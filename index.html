<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Affan Ludo & Carrom – Play and Fun</title>
<style>
:root{--bg:#24103a;--bg2:#3b1a5c;--card:#4a2273;--gold:#ffb02e;--teal:#19c3a6;--red:#ff4d6d;--ink:#fff7e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;overflow-x:hidden}
.scr{max-width:460px;margin:0 auto;padding:14px;animation:in .5s ease}@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1{font-size:38px;margin:4px 0;text-align:center;font-weight:800;color:var(--gold);text-shadow:0 3px 0 #8a4b00,0 0 24px #ffb02e66}
.sub{text-align:center;margin:0 0 18px;opacity:.8}.logo{font-size:64px;text-align:center;animation:fl 2.4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px) rotate(6deg)}}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 8px 0 #2d1148}
input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid #7b4bb0;background:#2d1148;color:var(--ink);margin:6px 0 12px;outline:none}input:focus{border-color:var(--gold)}
.btn{width:100%;font:inherit;font-weight:800;font-size:18px;padding:12px;border:0;border-radius:14px;color:#3a1d00;background:linear-gradient(#ffd25e,var(--gold));box-shadow:0 5px 0 #b86d00;cursor:pointer;position:relative;overflow:hidden;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b86d00}.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:#fff6;transform:skewX(-20deg);animation:sh 2.6s infinite}@keyframes sh{to{left:130%}}
.btn:disabled{filter:grayscale(1);opacity:.5}.btn:disabled::after{display:none}small{display:block;margin-top:10px;opacity:.65;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.av,.pill{background:var(--card);padding:6px 14px;border-radius:99px;font-weight:700}.pill{color:var(--gold);font-size:20px}.pill.up{animation:pop .6s}@keyframes pop{40%{transform:scale(1.25)}}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tabs button{font:inherit;font-weight:700;font-size:18px;padding:10px;border-radius:14px;border:2px solid #7b4bb0;background:transparent;color:var(--ink)}.tabs .on{background:var(--teal);border-color:var(--teal);color:#06352d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st{background:var(--card);border-radius:18px;padding:12px;text-align:center;animation:in .4s both}.st b{font-size:24px;color:var(--gold);display:block}.st span{display:block;font-size:14px;opacity:.85}.st .btn{margin-top:8px;font-size:16px;padding:8px}
.vs{display:flex;justify-content:space-around;align-items:center;margin:40px 0;font-size:56px}.vs i{font-style:normal;font-size:28px;color:var(--gold)}.spin{width:44px;height:44px;margin:0 auto 12px;border:5px solid #7b4bb0;border-top-color:var(--gold);border-radius:50%;animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.hd{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}.hd div{background:var(--card);padding:6px 12px;border-radius:12px}.hd .me{outline:3px solid var(--teal)}.pot{text-align:center;color:var(--gold);margin-bottom:6px}#msg{text-align:center;min-height:28px;font-weight:700;margin:6px 0}
.lb{position:relative;width:100%;aspect-ratio:1;background:radial-gradient(circle,#5b2d8c,#3a1a5c);border-radius:50%;box-shadow:inset 0 0 0 6px #7b4bb0}
.cell{position:absolute;width:8%;height:8%;margin:-4%;border-radius:50%;background:#f0e4ff;opacity:.85}.cell.safe{background:var(--gold);opacity:1}
.tk{position:absolute;width:10%;height:10%;margin:-5%;border-radius:50%;border:3px solid #fff;transition:left .2s,top .2s;box-shadow:0 4px 0 #0005;z-index:3}.tk.hit{animation:pop .5s}
.dice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:78px;line-height:1;z-index:2}.shake{animation:sk .15s infinite}@keyframes sk{25%{transform:translate(-50%,-50%) rotate(-20deg)}75%{transform:translate(-50%,-50%) rotate(20deg)}}
canvas{width:100%;display:block;border-radius:14px;touch-action:none;box-shadow:0 8px 0 #2d1148}input[type=range]{padding:0;height:8px;accent-color:var(--gold)}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}.res{background:var(--card);border-radius:24px;padding:24px;text-align:center;max-width:340px;width:100%;animation:zoom .5s cubic-bezier(.2,1.6,.4,1)}@keyframes zoom{from{transform:scale(.3);opacity:0}}
.res h2{font-size:34px;margin:0}.res p{margin:6px 0 14px;opacity:.9}.res .btn{margin-top:8px}.rc{position:fixed;top:-40px;font-size:28px;z-index:60;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--red);padding:10px 18px;border-radius:99px;z-index:70;font-weight:700}
.bt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;margin:0 0 14px;border-radius:24px;border:3px solid transparent;color:var(--ink);font:inherit;background:var(--card);text-align:left;box-shadow:0 8px 0 #2d1148;transition:.2s}.bt svg{width:104px;height:104px;flex:none;filter:drop-shadow(0 6px 0 #0004)}.bt b{font-size:30px;line-height:1}.bt span{display:block;opacity:.8}.bt.on{border-color:var(--gold);transform:scale(1.03);box-shadow:0 0 28px #ffb02e77,0 8px 0 #2d1148}.bt.on svg{animation:fl 2.4s ease-in-out infinite}.car{position:relative;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 15% 26px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}.vc{flex:0 0 70%;scroll-snap-align:center;border-radius:26px;padding:16px;text-align:center;transform:scale(.86);opacity:.55;transition:.25s;box-shadow:0 10px 0 #0005}.vc.act{transform:scale(1);opacity:1}.vc .em{font-size:56px}.vc h3{font-size:28px;margin:0}.vc svg{width:84px;display:block;margin:8px auto}.int{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;overflow:hidden}.pl{background:#0007;padding:10px 22px;border-radius:99px;font-size:24px;font-weight:800}.pl.l{animation:sl .6s cubic-bezier(.2,1.2,.4,1) both}.pl.r{animation:sr .6s .2s cubic-bezier(.2,1.2,.4,1) both}@keyframes sl{from{transform:translateX(-120vw)}}@keyframes sr{from{transform:translateX(120vw)}}.vn{font-size:44px;font-weight:800;animation:zoom .6s both;text-shadow:0 4px 0 #0005}.cdn{font-size:96px;font-weight:800;animation:zoom .5s both;text-shadow:0 5px 0 #0005}.bd{position:relative;width:100%;aspect-ratio:1;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 0 #2d1148;margin-top:6px}.bd i{position:absolute;width:6.6667%;height:6.6667%;border:1px solid #0002;box-sizing:border-box;font-style:normal;font-size:min(3.4vw,15px);display:flex;align-items:center;justify-content:center;color:#888}.base{position:absolute;width:40%;height:40%}.base::after{content:'';position:absolute;inset:16%;background:#fff;border-radius:14px}.tkn{position:absolute;width:5.2%;height:5.2%;margin:-2.6%;border-radius:50%;border:2px solid #fff;box-shadow:0 3px 0 #0006;transition:left .15s linear,top .15s linear;z-index:5}.tkn.mv{animation:pulse .7s infinite;cursor:pointer;z-index:9}@keyframes pulse{50%{transform:scale(1.4);box-shadow:0 0 14px 5px #fff}}.dbtn{font-size:64px;line-height:1;margin:12px auto 0;width:96px;height:96px;display:flex;align-items:center;justify-content:center;border-radius:22px;background:var(--card);box-shadow:0 6px 0 #2d1148;cursor:pointer;user-select:none}.dbtn.on{box-shadow:0 0 0 4px var(--gold),0 0 26px var(--gold)}.dbtn.shake{animation:sk2 .15s infinite}@keyframes sk2{25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
.rot i{transform:rotate(180deg)}.mu{position:fixed;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:90;border:0;border-radius:50%;width:42px;height:42px;background:var(--card);font-size:20px;color:var(--ink);box-shadow:0 4px 0 #2d1148}
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}input{-webkit-user-select:text;user-select:text}canvas,.tkn,.dbtn,.bd{touch-action:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app'),wait=ms=>new Promise(r=>setTimeout(r,ms)),fmt=n=>n.toLocaleString('en-IN'),R=Math.random,F=Math.floor;
const K='royalgames1',STAKES=[500,2000,5000,10000,20000,50000,100000],BOTS=['Rohit_77','Simran','Aman_Pro','Neha','Vikram','Pooja_09','Kabir'];
let S={coins:0,phone:''},game='ludo',QUIT=null,live=false;
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let AC=null,mute=false;const tone=(f,d,t='sine',v=.15,w=0,sl)=>{if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+w;o.type=t;o.frequency.setValueAtTime(f,t0);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d)}catch(e){}};
const SND={roll:()=>{for(let i=0;i<7;i++)tone(300+R()*500,.06,'square',.06,i*.08)},step:()=>tone(520,.07,'triangle',.18),land:()=>{tone(660,.1,'sine',.2);tone(880,.12,'sine',.15,.08)},cap:()=>tone(500,.35,'sawtooth',.16,0,80),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.2,i*.15)),lose:()=>[392,330,262].forEach((f,i)=>tone(f,.3,'sine',.2,i*.2)),click:()=>tone(700,.05,'square',.06),tick:()=>tone(900,.08,'sine',.15),go:()=>tone(1200,.3,'triangle',.2)};
document.addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}});document.addEventListener('click',e=>{if(e.target.closest('button'))SND.click()});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2000)}
function rain(em='🪙',n=34){for(let i=0;i<n;i++){const e=document.createElement('div');e.className='rc';e.textContent=em;e.style.left=R()*100+'vw';e.style.animationDuration=1.6+R()*1.8+'s';e.style.animationDelay=R()*.8+'s';document.body.append(e);setTimeout(()=>e.remove(),4500)}}

const VEN=[{n:'Mumbai',s:500,c:['#0f4c81','#00b4d8'],e:'🌇'},{n:'Rajasthan',s:2000,c:['#b5450b','#f4a259'],e:'🏰'},{n:'Jharkhand',s:5000,c:['#1b5e20','#66bb6a'],e:'🌿'},{n:'Uttar Pradesh',s:10000,c:['#6a1b9a','#ce93d8'],e:'🕌'},{n:'Bihar',s:20000,c:['#b71c1c','#ef5350'],e:'🌾'},{n:'UP & Bihar',s:50000,c:['#00695c','#4db6ac'],e:'🛕'},{n:'Kerala',s:100000,c:['#1565c0','#26c6da'],e:'🌴'}];let ven=VEN[0];
const LS=`<svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="16" fill="#fff"/><rect x="4" y="4" width="42" height="42" rx="14" fill="#ff4d6d"/><rect x="54" y="4" width="42" height="42" rx="14" fill="#ffb02e"/><rect x="4" y="54" width="42" height="42" rx="14" fill="#19c3a6"/><rect x="54" y="54" width="42" height="42" rx="14" fill="#4f8cff"/><g transform="rotate(14 50 50)"><rect x="33" y="33" width="34" height="34" rx="8" fill="#fff" stroke="#3a1a5c" stroke-width="3"/><circle cx="42" cy="42" r="3.5" fill="#3a1a5c"/><circle cx="58" cy="42" r="3.5" fill="#3a1a5c"/><circle cx="50" cy="50" r="3.5" fill="#3a1a5c"/><circle cx="42" cy="58" r="3.5" fill="#3a1a5c"/><circle cx="58" cy="58" r="3.5" fill="#3a1a5c"/></g></svg>`,CS=`<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="12" fill="#8a4b20"/><rect x="9" y="9" width="82" height="82" rx="6" fill="#f3cf94"/><circle cx="14" cy="14" r="7" fill="#1d0a2e"/><circle cx="86" cy="14" r="7" fill="#1d0a2e"/><circle cx="14" cy="86" r="7" fill="#1d0a2e"/><circle cx="86" cy="86" r="7" fill="#1d0a2e"/><circle cx="50" cy="46" r="16" fill="none" stroke="#8a4b20" stroke-width="2"/><circle cx="50" cy="46" r="5" fill="#ff4d6d"/><circle cx="41" cy="40" r="4.5" fill="#222"/><circle cx="59" cy="40" r="4.5" fill="#fff"/><circle cx="41" cy="53" r="4.5" fill="#fff"/><circle cx="59" cy="53" r="4.5" fill="#222"/><circle cx="50" cy="78" r="7" fill="#19c3a6" stroke="#fff" stroke-width="2"/></svg>`;
function lobby(){A.innerHTML=`<div class=scr><div class=top><div class=av>👤 Guest</div><div class=pill id=cp>🪙 ${fmt(S.coins)}</div></div><h1 style="font-size:30px">Affan Ludo & Carrom</h1><p class=sub>Play and Fun</p><button class=bt data-g=ludo>${LS}<div><b>Ludo</b><span>Race your token home</span></div></button><button class=bt data-g=carrom>${CS}<div><b>Carrom</b><span>Pot the coins, win the pot</span></div></button><button class=btn id=pl>Play</button>${S.coins<250?'<button class=btn id=rf style="margin-top:14px">Get 1,000 free coins</button>':''}<small>Coins are for playing only and cannot be exchanged for money.</small></div>`;const sel=()=>document.querySelectorAll('.bt').forEach(b=>b.classList.toggle('on',b.dataset.g==game));document.querySelectorAll('.bt').forEach(b=>b.onclick=()=>{game=b.dataset.g;sel()});sel();$('#pl').onclick=venues;const rf=$('#rf');if(rf)rf.onclick=()=>{S.coins+=1000;save();rain();lobby()}}
async function online(st){const rm=await claude.use('room').catch(()=>null);if(!rm)return toast('Online play needs a signed-in Claude account with access to this page');let room;try{room=await rm.join(game+'-'+st)}catch(e){return toast('Could not join the online lobby')}
A.innerHTML=`<div class=scr style='text-align:center'><div class=vs><div>😎</div><i>…</i><div>👤</div></div><div class=spin></div><h3>Waiting for another player…</h3><p class=sub>The match starts as soon as 2 players are at this table. Ask a friend to open this page and join the same table.</p><button class=btn id=bt2>Play vs Bot now</button><button class=btn id=cn style='margin-top:10px;background:#7b4bb0;color:#fff;box-shadow:0 5px 0 #4a2273'>Cancel</button></div>`;
let go=false,off=null;const stop=()=>{go=true;if(off)off()};
const chk=()=>{if(go)return;const ps=room.peers(),me=ps.find(p=>p.isMe&&p.sameTab);if(!me)return;let o=ps.find(p=>!p.isMe&&p.presence.opp==me.peer);if(!o){const ws=ps.filter(p=>p.presence.w==1&&(!p.isMe||p.sameTab)).map(p=>p.peer).sort(),i=ws.indexOf(me.peer),q=ws[i%2?i-1:i+1];if(!q)return;o=ps.find(p=>p.peer==q)}if(!o)return;stop();room.presence({w:0,opp:o.peer});start(st,{room,opp:o.peer,me:me.peer<o.peer?0:1})};
$('#cn').onclick=()=>{stop();room.leave();venues()};$('#bt2').onclick=()=>{stop();room.leave();start(st)};off=room.onPeers(chk);await room.presence({w:1,opp:null});chk()}
function venues(){A.innerHTML=`<div class=scr><div class=top><button class=av id=bk style="border:0;color:inherit;font:inherit">‹ Back</button><div class=pill>🪙 ${fmt(S.coins)}</div></div><h2 style="text-align:center;margin:0">${game=='ludo'?'Ludo':'Carrom'}: pick a table</h2></div><div class=car id=car>${VEN.map(v=>{const e=v.s/2,ok=S.coins>=e;return `<div class=vc style="background:linear-gradient(160deg,${v.c[0]},${v.c[1]})"><div class=em>${v.e}</div><h3>${v.n}</h3>${game=='ludo'?LS:CS}<div>${game=='carrom'?(v.s<=5000?6:9)+' pucks each':''}</div><div>Entry 🪙 ${fmt(e)}</div><div style="font-weight:800;color:#ffe08a;margin-bottom:10px">Win 🪙 ${fmt(v.s*.9)}</div>${ok?`${typeof claude!='undefined'?`<button class=btn data-s=${v.s} data-m=on>👥 Play online</button>`:''}<button class=btn data-s=${v.s} style='margin-top:8px;background:#fff;box-shadow:0 5px 0 #aaa'>🤖 Play vs Bot</button>`:`<button class=btn disabled>Need ${fmt(e-S.coins)} more</button>`}</div>`}).join('')}</div><div style="text-align:center;opacity:.7">Swipe to see more tables</div>`;$('#bk').onclick=lobby;const car=$('#car'),cs=[...car.children],upd=()=>{const m=car.scrollLeft+car.clientWidth/2;let b,bd=1e9;cs.forEach(c=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-m);if(d<bd){bd=d;b=c}});cs.forEach(c=>c.classList.toggle('act',c==b))};car.onscroll=upd;upd();cs.forEach(c=>{c.querySelectorAll('.btn').forEach(b=>b.onclick=e=>{if(!c.classList.contains('act')){c.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});return}b.dataset.m=='on'?online(+b.dataset.s):start(+b.dataset.s)})})}
function lobbyOld(){A.innerHTML=`<div class=scr><div class=top><div class=av>👤 Guest</div><div class=pill id=cp>🪙 ${fmt(S.coins)}</div></div><div class=tabs><button data-g=ludo>🎲 Ludo</button><button data-g=carrom>⚪ Carrom</button></div><div class=grid id=gr></div>${S.coins<250?'<button class=btn id=rf style="margin-top:14px">Get 1,000 free coins</button>':''}<small>Coins are for playing only and cannot be exchanged for money.</small></div>`;
const draw=()=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.g==game));$('#gr').innerHTML=STAKES.map((s,i)=>`<div class=st style="animation-delay:${i*60}ms"><b>🪙 ${fmt(s)}</b><span>Entry ${fmt(s/2)} each</span><span>Win ${fmt(s*.9)}</span><button class=btn data-s=${s} ${S.coins<s/2?'disabled':''}>Play</button></div>`).join('');
document.querySelectorAll('.st .btn').forEach(b=>b.onclick=()=>start(+b.dataset.s))};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{game=b.dataset.g;draw()});draw();
const rf=$('#rf');if(rf)rf.onclick=()=>{S.coins+=1000;save();rain();lobby()}}

async function start(st,net){ven=VEN.find(v=>v.s==st);const e=st/2,bot=net?'Online player':BOTS[F(R()*BOTS.length)];S.coins-=e;save();const o=document.createElement('div');o.className='int';o.style.background=`linear-gradient(160deg,${ven.c[0]},${ven.c[1]})`;o.innerHTML=`<div class=vn>${ven.e} ${ven.n}</div><div class="pl l">😎 You</div><div class=vn style="font-size:34px;color:#ffe08a">VS</div><div class="pl r" id=op>🔍 Searching…</div><div id=cd class=cdn style="opacity:0">3</div>`;document.body.append(o);await wait(1500);const op=$('#op');op.textContent='🤖 '+bot;op.style.animation='zoom .5s both';await wait(1000);const c=$('#cd');c.style.opacity=1;for(const n of ['3','2','1','GO!']){c.textContent=n;n=='GO!'?SND.go():SND.tick();c.style.animation='none';c.offsetWidth;c.style.animation='';await wait(650)}o.remove();play(st,bot,net)}
async function startOld(st){const e=st/2,bot=BOTS[F(R()*BOTS.length)];S.coins-=e;save();
A.innerHTML=`<div class=scr style="text-align:center"><div class=vs><div>😎</div><i>VS</i><div>🤖</div></div><div class=spin></div><h3>Finding an opponent…</h3></div>`;await wait(1500);
A.querySelector('h3').textContent=bot+' found!';await wait(900);play(st,bot)}

function play(st,bot,net){const g=game;QUIT=null;live=true;A.innerHTML=`<div class=scr><div style="text-align:right;margin-bottom:6px"><button class=av id=lv style="border:0;color:inherit;font:inherit">🚪 Leave</button></div><div class=hd><div class=me id=s0>😎 You</div><div id=s1>🤖 ${bot}</div></div><div class=pot>${ven.e} ${ven.n} • Pot 🪙 ${fmt(st)} • Win 🪙 ${fmt(st*.9)}</div><div id=bd></div><div id=msg></div></div>`;
(g=='ludo'?ludo:carrom)(st,bot,w=>setTimeout(()=>finish(st,w),900),net);
